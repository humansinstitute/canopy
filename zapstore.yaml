icon: ./android/icon.png
name: Canopy
summary: Native Kotlin Nostr client with Amber signing
description: |
  Canopy brings a reactive Nostr feed, profiles, threads, mentions, quotes,
  search, bookmarks, media and wallet settings to Android. Kotlin and Jetpack
  Compose provide a fully native interface; Amber signs using NIP-55 intents.
  Identity keys stay in Amber. NStack backup requires the browser bridge and is
  unavailable in the native Android app.
