plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'com.wingman.canopy'
    if (project.hasProperty('nativeReleaseTests')) testBuildType 'release'
    compileSdkVersion 'android-37.2'
    buildFeatures { buildConfig true; compose true }
    defaultConfig {
        applicationId 'com.wingman.canopy'
        minSdk 30
        targetSdk 36
        versionCode 4
        versionName '0.2.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            if (System.getenv('CANOPY_KEYSTORE')) {
                storeFile file(System.getenv('CANOPY_KEYSTORE'))
                storePassword System.getenv('CANOPY_STORE_PASSWORD')
                keyAlias System.getenv('CANOPY_KEY_ALIAS') ?: 'canopy'
                keyPassword System.getenv('CANOPY_KEY_PASSWORD') ?: System.getenv('CANOPY_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release { if (System.getenv('CANOPY_KEYSTORE')) signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    sourceSets {
        test.java.srcDir 'src/testShared/kotlin'
        androidTest.java.srcDir 'src/testShared/kotlin'
        androidTest.assets.srcDir '../../e2e/fixtures'
    }
    packaging { resources.excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1'] }
}
dependencies {
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.navigation:navigation-compose:2.9.5'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    implementation 'androidx.media3:media3-datasource-okhttp:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'io.coil-kt.coil3:coil-compose:3.3.0'
    implementation 'io.coil-kt.coil3:coil-network-okhttp:3.3.0'
    implementation 'io.coil-kt.coil3:coil-gif:3.3.0'
    implementation 'io.coil-kt.coil3:coil-svg:3.3.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'com.vitorpamplona.quartz:quartz-android:2.15.1'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    testImplementation 'fr.acinq.secp256k1:secp256k1-kmp-jni-jvm:0.24.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:5.5.1'
    testImplementation 'com.squareup.okhttp3:okhttp-tls:5.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.09.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:5.5.1'
    androidTestImplementation 'com.squareup.okhttp3:okhttp-tls:5.5.1'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
androidComponents {
    beforeVariants(selector().all()) { variant ->
        variant.enableUnitTest = true
    }
}
